<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Monami clone</title>
</head>
<body>
    <header>
  <div class="info">
    <div class="basicInfo">
      <div class="language">
        <span class="korea">
          KOR
        </span>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
      <ul class="social">
        <li><i class="fa-brands fa-facebook"></i></li>
        <li><i class="fa-brands fa-square-instagram"></i></li>
        <li><i class="fa-brands fa-youtube"></i></li>
      </ul>
    </div>
    <div class="guide">
      <span class="home">HOME</span>
      <span class="map">SITE MAP</span>
      <span class="contact">CONTACT US</span>
    </div>
  </div>
  <nav class="navbar">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9e/Monami_logo.png" alt="logo" class="logo">
    <ul class="navMenu">
      <li><span>모나미소개</span></li>
      <li><span>모나미제품</span></li>
      <li><span>NEWS & VIDEO</span></li>
      <li><span>모나미 미술대회</span></li>
      <li><span>고객지원</span></li>
      <li><span>기업 구매/개발</span></li>
    </ul>
    <ul class="icon">
      <li><i class="fa-brands fa-sistrix"></i></li>
      <li><i class="fa-solid fa-bars"></i></li>
    </ul>
  </nav>
</header>

<section class="intro">
  <h1 class="mainComment">어쩌면 삶은 인생이라는 종이 위에 써 내려가는 펜의 기록 같습니다.</h1>
  <span class="subComment">그중에서도 지우고 싶지 않은 기록이 있습니다. 모나미는 언제나 당신의 행복한 기록과 함께 합니다.</span>
</section>

<section class="newArrivals">
  <div class="product">
    <div class="title">
      <h1 class="mainTitle">new arrivals</h1>
      <span class="subtitle">가장 먼저 만나는 설레는 기다림</span> 
    </div>
    <img src="https://images.unsplash.com/photo-1605641987825-c1664626d79f?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" class="img1">
    <img src="https://images.unsplash.com/photo-1531346878377-a5be20888e57?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" class="img2">
    <img src="https://images.unsplash.com/photo-1722929309984-c6b3e55dd6e5?q=80&w=1073&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" class="img3">
    <img src="https://images.unsplash.com/photo-1646534607539-6355deaf495c?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" class="img4">
    <img src="https://images.unsplash.com/photo-1617719739257-ad55b0936416?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" class="img5">
  </div>

</html>
